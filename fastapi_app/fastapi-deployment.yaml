apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      name: fastapi
      labels:
        app: fastapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fastapi
        image: fastapi-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: api
          containerPort: 8000
        resources:
          limits:
            memory: "200M"
            cpu: "100m"
